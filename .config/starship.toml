"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](user_bg)\
${env_var.PROMPT_OS}\
$username\
[](bg:host_bg fg:user_bg)\
$hostname\
[](bg:dir_bg fg:host_bg)\
$directory\
[](bg:git_bg fg:dir_bg)\
$git_branch\
${env_var.PROMPT_GIT_STATUS}\
[](fg:git_bg bg:lang_bg)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:lang_bg bg:env_bg)\
$conda\
[](fg:env_bg bg:time_bg)\
$time\
[ ](fg:time_bg)\
$cmd_duration\
$line_break\
$character"""

# Colors come from the segment keys (user_bg, dir_fg, ...) of the prompt
# palettes near the end of this file. This is the default; `prompt-theme`
# (common.bash) picks another one.
palette = 'duo'

# Not in `format`: picking the icon runs `lsb_release -a` (a shell script,
# ~20ms) on every prompt. common.bash resolves it once per host with
# `starship module os`, caches it under /tmp, and the prompt shows it via
# env_var.PROMPT_OS, so this format is plain and the style lives there.
[os]
disabled = false
format = "$symbol"

[env_var.PROMPT_OS]
variable = "PROMPT_OS"
style = "bg:user_bg fg:user_fg"
format = "[$env_value]($style)"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:user_bg fg:user_fg"
style_root = "bg:user_bg fg:user_fg"
format = '[ $user]($style)'

# Home is on NFS shared by several VMs, so the prompt is otherwise the
# same on each. Shown always, not only over SSH: inside tmux
# SSH_CONNECTION can be stale or missing.
[hostname]
ssh_only = false
style = "bg:host_bg fg:host_fg"
format = '[ $hostname]($style)'

[directory]
style = "bg:dir_bg fg:dir_fg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:git_bg"
format = '[[ $symbol $branch ](fg:git_fg bg:git_bg)]($style)'

# Not in `format`: it walks the whole work tree, which is slow on NFS. The
# shell runs `starship module git_status` in the background and the prompt
# shows the last result via env_var.PROMPT_GIT_STATUS (see common.bash),
# so this format is plain text and the styling lives on the env_var module.
[git_status]
style = ""
format = '($all_status$ahead_behind)'

[env_var.PROMPT_GIT_STATUS]
variable = "PROMPT_GIT_STATUS"
style = "bg:git_bg"
format = '[[($env_value )](fg:git_fg bg:git_bg)]($style)'

[nodejs]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[c]
symbol = " "
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[rust]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[golang]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[php]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[java]
symbol = " "
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[kotlin]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[haskell]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[python]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:lang_fg bg:lang_bg)]($style)'

[docker_context]
symbol = ""
style = "bg:env_bg"
format = '[[ $symbol( $context) ](fg:env_fg bg:env_bg)]($style)'

[conda]
symbol = "  "
style = "fg:env_fg bg:env_bg"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:time_bg"
format = '[[  $time ](fg:time_fg bg:time_bg)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:#a6e3a1)'
error_symbol = '[❯](bold fg:#f38ba8)'
vimcmd_symbol = '[❮](bold fg:#a6e3a1)'
vimcmd_replace_one_symbol = '[❮](bold fg:#b4befe)'
vimcmd_replace_symbol = '[❮](bold fg:#b4befe)'
vimcmd_visual_symbol = '[❮](bold fg:#f9e2af)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:time_bg"
disabled = false
show_notifications = true
min_time_to_notify = 45000

# Prompt palettes: a background and a text color for each segment. Segments
# that meet differ by at least 0.1 in OKLab (rainbow keeps its original
# colors), and text keeps 4.2:1 contrast or more. `prompt-theme` lists the
# palettes that define user_bg.

# one blue, each segment a step lighter than the last
[palettes.blue]
user_bg = "#223e61"
user_fg = "#edf2f9"
host_bg = "#3f5c82"
