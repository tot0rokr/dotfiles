# This tmux statusbar config was created by tmuxline.vim
# on Fri, 16 Oct 2026, from the github_dark_colorblind colors. Edited by hand:
# #F shows the window flags, and the other windows' text follows #[default] so
# a per-window window-status-style (bell, Claude's tmux-pending marks) shows.

set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g message-command-style "fg=#58a6ff,bg=#15202e"
set -g status-right-style "none"
set -g pane-active-border-style "fg=#58a6ff"
set -g status-style "none,bg=#0d1117"
set -g message-style "fg=#58a6ff,bg=#15202e"
set -g pane-border-style "fg=#15202e"
set -g status-right-length "100"
set -g status-left-length "100"
setw -g window-status-activity-style "none"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#8b949e,bg=#0d1117"
set -g status-left "#[fg=#04070d,bg=#58a6ff] #S #[fg=#58a6ff,bg=#0d1117,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#15202e,bg=#0d1117,nobold,nounderscore,noitalics]#[fg=#58a6ff,bg=#15202e] %Y-%m-%d  %H:%M #[fg=#58a6ff,bg=#15202e,nobold,nounderscore,noitalics]#[fg=#04070d,bg=#58a6ff] #h "
setw -g window-status-format "#[default] #I  #W#F "
setw -g window-status-current-format "#[fg=#0d1117,bg=#15202e,nobold,nounderscore,noitalics]#[fg=#58a6ff,bg=#15202e,bold] #I #[fg=#58a6ff,bg=#15202e,bold] #W#F #[fg=#15202e,bg=#0d1117,nobold,nounderscore,noitalics]"
